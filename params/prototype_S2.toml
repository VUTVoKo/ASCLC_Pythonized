# MAPbBr3 S2, dark - prototype comparison
#
# The same sample as MAPbBr3_S2.toml, but with every modelling choice pinned to
# what the prototype spreadsheet computed, so the two can be run side by side.
# Use it to reproduce pre-port results, not for new work: the trap integrates to
# (pi/4)*N_t rather than N_t under this profile.
#
# docs/prototype_differences.md explains each choice and what it changes.
#
# Units: energies eV (vacuum scale), concentrations m^-3, lengths m,
# mobilities m^2 V^-1 s^-1, temperatures K.

name = "MAPbBr3 S2, dark (prototype options)"

# Fixed properties, from the literature.
[material]
name = "MAPbBr3"
E_c = -3.36  # eV
E_v = -5.58  # eV
eps_r = 25.5  # -
m_eff_h = 0.305  # m*/m_e
m_eff_e = 0.32  # m*/m_e

# Measured geometry. `area` only converts current to density.
[device]
thickness = 0.0006  # m
area = 7.7e-06  # m^2
temperature = 299.0  # K

# The five hand-selected parameters (Table S2 'Variable').
[params]
mu_0 = 0.0027  # m^2 V^-1 s^-1
N_t = 4.7e+16  # m^-3
E_t = -4.82  # eV
T_t = 30.0  # K
E_F0 = -4.84  # eV

# Pinned rather than defaulted: these are the prototype's readings, and the
# defaults now follow the article and the SI instead.
[model]
trap_profile = "prototype_sech"          # g(E)!M13, integrates to (pi/4)*N_t
gamma_model  = "Tt/T"                    # j(U)!C6, not Supplementary Note M4
theta_model  = "absolute_over_injected"  # n(E)!N = ABS(L/J), unbounded
space_charge = "injected_total"
constants    = "prototype"               # the spreadsheet's rounded values

# Optional numerical choices.
[numerics]
V_max = 10.0
# n_points = 3001
# window   = 7    # points per local slope fit
# bin_size = 1
