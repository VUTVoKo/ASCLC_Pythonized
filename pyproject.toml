[project]
name = "asclc"
version = "0.1.0"
description = "Advanced space-charge-limited current model for semiconductor J-V analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
plot = ["matplotlib>=3.7"]

[project.scripts]
asclc = "asclc:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["asclc", "asclc_plot"]

[tool.pytest.ini_options]
testpaths = ["."]
filterwarnings = ["ignore::RuntimeWarning"]

[tool.ruff]
line-length = 88
target-version = "py310"
